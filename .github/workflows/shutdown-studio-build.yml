name: Build GR Shutdown Studio
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'tests/shutdown_studio/**'
      - 'docs/extensions/shutdown-studio-user-guide.md'
      - 'tools/gr4_shutdown.py'
      - 'tools/gr3x_urban_*.py'
      - 'tools/gr4_model.py'
      - 'tools/audit_shutdown_compatibility.py'
      - 'tools/pad_jpeg.py'
      - 'tools/create_factory_entry.py'
      - 'examples/*family*'
      - 'examples/*urban*'
      - 'examples/identify-gr4-model.ttl.example'
      - '.github/workflows/shutdown-studio-build.yml'
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: macOS-arm64
          - os: macos-15-intel
            artifact: macOS-x64
          - os: windows-latest
            artifact: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'apps/gr_shutdown_studio/requirements*.txt'
      - run: python -m pip install -r apps/gr_shutdown_studio/requirements-build.txt
      - run: python -m unittest discover -s tests/shutdown_studio -v
      - run: python -m unittest discover -s tests -v
      - run: python apps/gr_shutdown_studio/build.py
      - name: Archive macOS bundle with permissions
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc --keepParent 'app-dist/GR Shutdown Studio.app' app-dist/GR-Shutdown-Studio-macOS.zip
          python -c "from zipfile import ZipFile; z = ZipFile('app-dist/GR-Shutdown-Studio-macOS.zip', 'a'); z.write('app-dist/START-HERE.txt', 'START-HERE.txt'); z.close()"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: GR-Shutdown-Studio-${{ matrix.artifact }}
          path: app-dist/GR-Shutdown-Studio-macOS.zip
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: GR-Shutdown-Studio-${{ matrix.artifact }}
          path: app-dist/GR Shutdown Studio/
